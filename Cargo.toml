[package]
name = "hylki"
version = "1.39.1-beta.1"
edition = "2021"
description = "A clean, fast GNOME-native email client"
license = "AGPL-3.0-or-later"
repository = "https://github.com/hyprlab/hylki"
homepage = "https://hylki.hyprlab.co"

[features]
# The community beta channel: "Hylki (beta)" branding, app ID
# co.hyprlab.Hylki.Beta, a "b"-suffixed version, and — inside Flatpak — the
# stable app's data dirs, so beta testers share their accounts and mail cache
# with the stable install instead of setting everything up twice.
beta = []

[dependencies]
# v4_14 for GtkPrintDialog: printing needs an async dialog, because the older
# blocking one spins a nested main loop and glib's future executor aborts when
# re-entered (see MessageViewInput::Print). The GNOME 50 runtime has GTK 4.20.
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
# v1_6 for AdwStyleManager:accent-color: the System theme swatch paints the
# accent the desktop is actually set to, and that property is the only thing
# that reports it. libadwaita 1.6 is a 2024 release; the GNOME 50 runtime has
# 1.9.
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
relm4 = { version = "0.9", features = ["macros", "libadwaita"] }
relm4-components = "0.9"
# v2_44 for WebKitEditorState::changed: the composer's undo (#200) has to know
# when the body's own text history gains or loses a step, and that signal is
# the only thing that says so. WebKitGTK 6.0 starts at 2.40, so the floor this
# sets is a 2024 release; the GNOME 50 runtime has 2.50.
webkit6 = { version = "0.4", features = ["v2_44"] }
# PDF thumbnails in the attachment gallery (first-page render via poppler-glib).
poppler-rs = { version = "0.24", features = ["v20_9"] }
# "png": only to enable cairo-rs's `ImageSurface::write_to_png`, used to hand a
# rendered PDF page to gdk::Texture the same way every other thumbnail loads.
cairo-rs = { version = "0.20", features = ["png"] }
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async mail stack (runs on a dedicated worker thread + tokio runtime)
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "time", "macros"] }
futures = "0.3"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.9"
lettre = { version = "0.11", default-features = false, features = ["tokio1-native-tls", "smtp-transport", "builder"] }
rfc2047-decoder = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"

# OAuth: PKCE S256 (RFC 7636) needs SHA-256 + base64url, and every token and
# CSP nonce comes from the OS CSPRNG. All three are already in the dependency
# graph via keyring, so naming them here adds no new downloads.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

# Gravatar (opt-in): MD5 of the email + a simple blocking HTTPS fetch
ureq = { version = "2", features = ["json"] }
serde_json = "1"

# GNOME Contacts integration via Evolution Data Server (D-Bus)
zbus = "4"
ammonia = "4.1.4"
# Tray icon (StatusNotifierItem / AppIndicator) for desktops that have a tray
ksni = { version = "0.3.6", default-features = false, features = ["tokio", "blocking"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
markup5ever_rcdom = "0.39.0"
html5ever = "0.39"

[build-dependencies]
# Compiles resources/veem.gresource.xml (the bundled symbolic icons) into a
# .gresource blob embedded in the binary. See build.rs.
glib-build-tools = "0.20"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
