<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  WebKit's fonts when the host's hang it (#296). Hylki points its web
  processes here only after a probe page has hung on the usual set and
  loaded on this one; see src/web_fonts.rs.

  This is the runtime's own configuration with nothing from the host in
  it. It does not include /etc/fonts/fonts.conf, because that pulls in
  conf.d/50-flatpak.conf, which adds the host's font folders, reads the
  host's font caches and includes /run/host/font-dirs.xml; rejecting the
  host's fonts after loading them all was not enough. So the folders,
  aliases and caches are listed here, and every conf.d file is included
  by name except the four that bring in fonts or settings from outside
  the runtime (05-flatpak-fontpath, 50-flatpak, 50-user, 51-local). A
  file a later runtime drops is skipped; one it adds is simply missed.
-->
<fontconfig>
  <!-- The runtime's fonts, salted as 05-flatpak-fontpath.conf salts them
       so the caches built with the runtime still match. -->
  <dir salt="flatpak">/usr/share/fonts</dir>
  <dir>/app/share/fonts</dir>

  <!-- The family spellings fonts.conf accepts. -->
  <match target="pattern">
    <test qual="any" name="family"><string>mono</string></test>
    <edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans serif</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>system ui</string></test>
    <edit name="family" mode="assign" binding="same"><string>system-ui</string></edit>
  </match>

  <include ignore_missing="yes">/etc/fonts/conf.d/10-hinting-slight.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/10-scale-bitmap-fonts.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/10-sub-pixel-none.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/10-yes-antialias.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/11-lcdfilter-default.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/20-unhint-small-dejavu-sans.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/20-unhint-small-dejavu-sans-mono.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/20-unhint-small-dejavu-serif.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/20-unhint-small-vera.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/30-0-google-crosextra-caladea.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/30-0-google-crosextra-carlito.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/30-metric-aliases.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/30-tex-gyre.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/40-nonlatin.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/45-generic.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/45-latin.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/48-spacing.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/49-sansserif.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/57-dejavu-sans.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/57-dejavu-sans-mono.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/57-dejavu-serif.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/59-liberation-fonts-mono.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/59-liberation-fonts-narrow.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/59-liberation-fonts-sans.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/59-liberation-fonts-serif.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/60-generic.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/60-latin.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/62-google-crosextra-caladea.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/62-google-crosextra-carlito.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/65-fonts-persian.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/65-nonlatin.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/69-gnu-free-mono.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/69-gnu-free-sans.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/69-gnu-free-serif.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/69-unifont.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/70-no-bitmaps-except-emoji.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/80-delicious.conf</include>
  <include ignore_missing="yes">/etc/fonts/conf.d/90-synthetic.conf</include>

  <cachedir>/usr/lib/fontconfig/cache</cachedir>
  <cachedir>/app/cache/fontconfig</cachedir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
