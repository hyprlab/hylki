<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  WebKit's fonts in the AppImage when the host's hang it (#296), the
  counterpart of data/fontconfig/fallback.conf in the Flatpak. Hylki points
  its web processes here only after a probe page has hung on the host's set
  and loaded on this one; see src/desktop/web_fonts.rs. The bundle's .env
  names this file in HYLKI_FONT_FALLBACK_CONF.

  The fonts are the few the bundle carries in share/hylki/fonts. The bundle
  is mounted somewhere new on every start, so the folder is given relative
  to this file and remapped to a fixed name: fontconfig keys its cache by
  folder, and without the remap every start would scan the fonts again and
  leave another cache file behind.

  Nothing comes from the host: tools/build-appimage.sh writes the rules of
  the build's own conf.d in place of the marker below, rather than including
  /etc/fonts, whose conf.d brings in the user's and the system's folders.
-->
<fontconfig>
  <remap-dir prefix="relative" as-path="/hylki-appimage/fonts">../fonts</remap-dir>

  <!-- @RULES@ -->

  <cachedir prefix="xdg">hylki/fontconfig</cachedir>
</fontconfig>
