name: Build AppImage
run-name: AppImage ${{ inputs.ref || github.ref_name }}

# The AppImage (#235) carries every library down to glibc, so it has to be
# built against current GTK and WebKitGTK inside Arch rather than on the
# maintainer's Fedora machine. That is what the container below is, and it is
# the same one pkgforge builds theirs in. Both architectures build natively,
# aarch64 on GitHub's arm64 runners.
#
# Every tag builds, stable and beta alike: a beta tag (vX.Y.Z-beta.N) makes
# the beta app, Hylki-Beta-<arch>.AppImage (see tools/build-appimage.sh).
# Nothing is published from here. The ship scripts download the two
# artifacts, attach them to the GitHub release and publish them through
# Flatout, which serves each channel's newest AppImage and its .zsync at
# https://hylki.hyprlab.co/download/, the address every bundle updates from.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch or SHA to build'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runs-on: ubuntu-latest }
          - { arch: aarch64, runs-on: ubuntu-24.04-arm }

    container: ghcr.io/pkgforge-dev/archlinux:latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          path: src

      # The build script as this workflow knows it. A run started by hand
      # builds an older tag, whose own copy may not make the beta app or
      # carry the fallback fonts yet.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: ci

      - name: Build
        # The script notices it is already inside Arch and builds in place.
        run: HYLKI_APPIMAGE_SRC="$PWD/src" ci/tools/build-appimage.sh

      - name: Check the result is the right app, architecture and channel
        # `appinfo` is written beside the bundle by quick-sharun; the same
        # fields are inside the bundle's launcher, which is compressed and so
        # cannot simply be grepped for. The update address is plain text in
        # the runtime's .upd_info section.
        run: |
          want="$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)"
          case "$want" in
            *-beta.*) name=Hylki-Beta; feed="download/beta/Hylki-Beta" ;;
            *) name=Hylki; feed="download/Hylki" ;;
          esac
          out="src/packaging/out/$name-${{ matrix.arch }}.AppImage"
          file "$out" | tee /dev/stderr
          cat src/packaging/out/appinfo
          grep -qx "X-AppImage-Version=$want" src/packaging/out/appinfo \
            || { echo "built app is not $want" >&2; exit 1; }
          grep -qx "X-AppImage-Arch=${{ matrix.arch }}" src/packaging/out/appinfo \
            || { echo "built app is not ${{ matrix.arch }}" >&2; exit 1; }
          upd="$(readelf -p .upd_info "$out" | sed -n 's/^ *\[ *0\] *//p')"
          echo "updates from: $upd"
          [ "$upd" = "zsync|https://hylki.hyprlab.co/$feed-${{ matrix.arch }}.AppImage.zsync" ] \
            || { echo "wrong update information" >&2; exit 1; }
          echo "built $name $want for ${{ matrix.arch }}"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: hylki-appimage-${{ matrix.arch }}
          path: src/packaging/out/${{ env.NAME }}-${{ matrix.arch }}.AppImage
          retention-days: 30
          if-no-files-found: error
